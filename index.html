  <div id="map"></div>

  <div id="top">
    <div id="searchBox" class="card">
      <button id="submitSearch" class="lead" aria-label="Search"><svg class="ico" aria-hidden="true"><use href="#i-search"/></svg></button>
      <input id="search" type="search" placeholder="Where to?" autocomplete="off" enterkeyhint="search">
      <button id="clear" class="icon" aria-label="Clear" hidden><svg class="ico" aria-hidden="true"><use href="#i-close"/></svg></button>
      <!-- Shares the slot with Clear: the Menu when the search box is idle, Clear while searching. -->
      <button id="menuButton" class="lead" aria-label="Menu"><svg class="ico" aria-hidden="true"><use href="#i-menu"/></svg></button>
      <div id="progress" hidden></div>
      <div id="results"></div>
    </div>
    <button id="update" class="card" hidden>New version of Mana · <b>Tap to update</b></button>
    <div id="banner" class="card" hidden>
      <div id="arrow"></div>
      <div>
        <div id="bannerDistance"></div>
        <div id="bannerText" aria-live="polite"></div>
      </div>
      <div id="then" hidden></div>
    </div>
  </div>

  <!-- One column of controls on the right, Report at the bottom nearest the thumb; the left is the speed sign's alone. -->
  <div id="side">
    <button id="trafficButton" class="fab" aria-label="Traffic map"><svg class="ico" aria-hidden="true"><use href="#i-traffic"/></svg></button>
    <button id="locate" class="fab" aria-label="Show my location"><svg class="ico" aria-hidden="true"><use href="#i-locate"/></svg></button>
    <button id="reportButton" class="fab" aria-label="Report"><svg class="ico" viewBox="0 -960 960 960" aria-hidden="true"><path id="reportGlyph"/></svg></button>
  </div>
  <div id="speedView" role="group" aria-label="GPS speed and speed limit" hidden>
    <div id="speedLimit" hidden></div>
    <div id="speedReading"><strong id="currentSpeed">–</strong><small>km/h</small></div>
  </div>

  <!-- A picked place, before any route: where it is, then Directions or Close. -->
  <div id="placeCard" class="card bottomCard" hidden>
    <div id="placeName"></div>
    <div id="placeDetail"></div>
    <div class="placeActions">
      <button id="placeGo" class="primary">Directions</button>
      <!-- Labelled; on narrow cards they keep only their icons (style.css). -->
      <button id="placeSave" class="pill" aria-label="Save this place"><svg class="ico" aria-hidden="true"><use href="#i-star"/></svg><span>Save</span></button>
      <button id="placeClose" class="pill" aria-label="Close"><svg class="ico" aria-hidden="true"><use href="#i-close"/></svg><span>Close</span></button>
    </div>
    <div class="placeExtras">
      <button id="placeFlag" class="plain" hidden>Not here?</button>
      <button id="placeAdd" class="plain" hidden><svg class="ico" aria-hidden="true"><use href="#i-add-location"/></svg> Add this place</button>
    </div>
  </div>

  <div id="panel" class="card bottomCard" hidden>
    <div id="trip"></div>
    <div id="routes"></div>
    <!-- Under the routes: what to do with this trip, each icon with its word. -->
    <div id="routeActions">
      <button id="routeAddStop" class="action"><svg class="ico" aria-hidden="true"><use href="#i-add-location"/></svg>Add stop</button>
      <button id="routeSave" class="action" aria-label="Save this place"><svg class="ico" aria-hidden="true"><use href="#i-star"/></svg><span>Save</span></button>
    </div>
    <!-- While driving, instead of Go: add a stop, or leave (calm, so it doesn't compete with Report). -->
    <div id="navInfo" hidden>
      <div class="navStats">
        <div id="navEta"></div>
        <div id="navLeft"></div>
      </div>
      <button id="navAddStop" class="pill"><svg class="ico" aria-hidden="true"><use href="#i-add-location"/></svg>Add stop</button>
      <button id="exit" class="pill exit"><svg class="ico" aria-hidden="true"><use href="#i-stop"/></svg>Exit</button>
    </div>
    <button id="go" class="primary"><svg class="ico" aria-hidden="true"><use href="#i-navigation"/></svg> Go</button>
  </div>

  <div id="sheet" class="card" hidden>
    <div id="sheetTitle"></div>
    <div id="tiles"></div>
    <button id="sheetClose" class="plain">Close</button>
  </div>

  <div id="toast" role="status" aria-live="polite" hidden></div>

  <div id="install" class="card" hidden>
    <p>For the best drive, <b>add Mana to your home screen</b> and keep it open on screen while
      navigating (directions stop when the screen locks). On Android, the
      <a href="https://github.com/ycryga/roadwise-releases/releases/latest">full app</a> keeps going
      with the screen off.</p>
    <button id="installOk" class="plain">Got it</button>
  </div>

  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script src="config.js"></script>
  <script src="glyphs.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
